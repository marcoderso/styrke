# Fragensatz der Qualitätsstufe (Stufe 8).
#
# Jede Frage hat eine Referenzantwort für die Bewertung von Hand und, wo es
# geht, eine automatische Prüfung:
#   muss:        Liste von Gruppen; aus jeder Gruppe muss ein Begriff vorkommen (Groß/klein egal)
#   regex:       Muster, die alle passen müssen
#   darf_nicht:  Begriffe, die nicht vorkommen dürfen
#   werkzeug:    erwarteter Werkzeugaufruf (name, args) oder "keines"
#   json:        die Antwort muss JSON mit diesen Schlüsseln (keys) und Werten (werte) sein
#   nadel / kontext_tokens: Die Frage bekommt einen langen Text vorangestellt, in dem der Satz "nadel" steht
#   pruefung: manuell   keine automatische Prüfung; zählt nur in der Bewertung von Hand
#                       Diese Fragen bekommen den Zusatz, kurz zu antworten (stages.s8.manual_suffix).
#
# Die Angaben zum Firmenwissen stammen aus öffentlichen Quellen (Stand November 2026):
#   chemie.de, Lexikon, Eintrag "Stickstoffwerke Piesteritz"
#   Nordkurier vom 18.07.2026, "Warum SKW Piesteritz für Europas Versorgung so wichtig ist"
# Wer es besser weiß, korrigiert die Referenzantworten hier; die Messung ändert sich dadurch nicht.

werkzeuge:
  - name: lagerbestand
    description: Liefert den aktuellen Lagerbestand eines Artikels in Tonnen.
    parameters: {type: object, properties: {artikel: {type: string, description: Name des Artikels}}, required: [artikel]}
  - name: termin_anlegen
    description: Legt einen Termin im Kalender an.
    parameters:
      type: object
      properties:
        titel: {type: string}
        datum: {type: string, description: "Datum im Format JJJJ-MM-TT"}
        uhrzeit: {type: string, description: "Uhrzeit im Format HH:MM"}
      required: [titel, datum, uhrzeit]
  - name: wetter
    description: Liefert die Wettervorhersage für einen Ort.
    parameters: {type: object, properties: {ort: {type: string}, tag: {type: string, description: "heute oder morgen"}}, required: [ort]}

fragen:
  # -- Firmenwissen -----------------------------------------------------------
  - id: firma-01
    kategorie: firmenwissen
    frage: Was ist SKW Piesteritz?
    referenz: >-
      Die SKW Stickstoffwerke Piesteritz GmbH ist ein Chemieunternehmen in Lutherstadt Wittenberg, Ortsteil
      Piesteritz, in Sachsen-Anhalt. Nach eigenen Angaben ist sie Deutschlands größter Hersteller von Ammoniak
      und Harnstoff. Daraus entstehen Stickstoffdünger, Harnstofflösung für AdBlue und Salpetersäure. Das
      Unternehmen gehört zur tschechischen Agrofert-Gruppe.
    muss: [[Wittenberg, Piesteritz], [Ammoniak, Harnstoff], [Dünge]]
  - id: firma-02
    kategorie: firmenwissen
    frage: Wem gehört SKW Piesteritz?
    referenz: Der tschechischen Agrofert-Gruppe. Sie stieg 2002 gemeinsam mit Ameropa ein und ist seit 2006 alleiniger Eigentümer.
    muss: [[Agrofert]]
  - id: firma-03
    kategorie: firmenwissen
    frage: Seit wann gibt es den Chemiestandort Piesteritz, und wie hieß das Werk bei seiner Gründung?
    referenz: Seit 1915. Das Werk wurde im März 1915 als Reichsstickstoffwerke Piesteritz gegründet.
    muss: [["1915"], [Reichsstickstoffwerk]]
  - id: firma-04
    kategorie: firmenwissen
    frage: Welche Grundstoffe stellt SKW Piesteritz her, und wofür werden sie gebraucht?
    referenz: >-
      Ammoniak und Harnstoff. Daraus werden Stickstoffdünger für die Landwirtschaft, Harnstofflösung für AdBlue
      zur Abgasreinigung von Dieselmotoren und Salpetersäure hergestellt.
    muss: [[Ammoniak], [Harnstoff], [Dünge, AdBlue]]
  - id: firma-05
    kategorie: firmenwissen
    frage: Warum trifft ein hoher Erdgaspreis ein Unternehmen wie SKW Piesteritz besonders hart?
    referenz: >-
      Erdgas ist dort nicht nur Energiequelle, sondern auch Rohstoff: Aus ihm wird der Wasserstoff gewonnen, der
      mit Stickstoff aus der Luft zu Ammoniak reagiert. Die Herstellung ist sehr energieintensiv, der Gaspreis
      bestimmt deshalb einen großen Teil der Kosten.
    muss: [[Rohstoff, Wasserstoff, Ausgangsstoff], [Ammoniak]]

